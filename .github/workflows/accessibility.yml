name: Accessibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      automated: ${{ steps.select.outputs.automated }}
      catalog: ${{ steps.select.outputs.catalog }}
      performance: ${{ steps.select.outputs.performance }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Selector regression tests (no dependencies)
        run: node --test scripts/ci/select-checks.test.mjs
      - name: Fetch explicit PR comparison commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # A missing baseline is handled conservatively by the selector.
        run: git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" || true
      - name: Select affected checks
        id: select
        run: node scripts/ci/select-checks.mjs
  automated:
    needs: selection
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      SELECTION_RESULT: ${{ needs.selection.result }}
      CHECK_PLAN: ${{ needs.selection.outputs.plan }}
      CHECK_ENABLED: ${{ needs.selection.outputs.automated }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate selection and explain intentional skips
        run: node scripts/ci/run-checks.mjs gate automated
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: needs.selection.outputs.automated == 'true'
      - name: Install dependencies
        if: needs.selection.outputs.automated == 'true'
        run: pnpm install --frozen-lockfile
      - name: Affected workspace typechecks
        if: needs.selection.outputs.automated == 'true'
        run: node scripts/ci/run-checks.mjs typecheck
      - name: Shared keyboard and state-label contracts
        if: needs.selection.outputs.automated == 'true'
        run: node scripts/ci/run-checks.mjs unit
      - name: Install virtual display dependencies
        if: fromJSON(needs.selection.outputs.plan).desktop != 'skip'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth
      - name: Install Playwright Chromium
        if: fromJSON(needs.selection.outputs.plan).desktop != 'skip'
        run: pnpm --filter git-stacks exec playwright install --with-deps chromium
      - name: Selected nonvisual renderer checks
        if: fromJSON(needs.selection.outputs.plan).desktop != 'skip'
        # Root Turbo invocation retains build:gallery; macOS pixel baselines stay local.
        run: xvfb-run -a node scripts/ci/run-checks.mjs desktop
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: warn
  design:
    needs: selection
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SELECTION_RESULT: ${{ needs.selection.result }}
      CHECK_PLAN: ${{ needs.selection.outputs.plan }}
      CHECK_ENABLED: ${{ needs.selection.outputs.catalog }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate selection and explain intentional skips
        run: node scripts/ci/run-checks.mjs gate design
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: needs.selection.outputs.catalog == 'true'
      - name: Install dependencies
        if: needs.selection.outputs.catalog == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        if: needs.selection.outputs.catalog == 'true'
        run: pnpm --filter design exec playwright install --with-deps chromium
      - name: Catalog validation, build, and tests
        if: needs.selection.outputs.catalog == 'true'
        run: node scripts/ci/run-checks.mjs catalog
      - name: Upload catalog failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-catalog-failures
          path: |
            apps/design/test-results/
            apps/design/playwright-report/
  root-suite:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter design exec playwright install --with-deps chromium
      - name: Complete root suite
        run: pnpm test
  native-lane-envelope:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth
      - name: Build production desktop
        run: pnpm run build
      - name: Provision pinned Git runtime
        run: pnpm --filter git-stacks run provision:git-runtime
      - name: Verify pinned Git runtime
        run: pnpm --filter git-stacks run verify:git-runtime
      - name: Configure pinned Electron sandbox helper
        run: |
          pnpm --filter git-stacks exec install-electron
          sandbox="$(realpath apps/desktop/node_modules/electron/dist/chrome-sandbox)"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Measure native lane envelopes
        run: xvfb-run -a pnpm --filter git-stacks exec tsx scripts/perf/run-benchmarks.ts --lanes-only --out benchmarks/lanes
      - name: Upload native lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-lane-envelope
          path: apps/desktop/benchmarks/lanes/
          if-no-files-found: warn
  budgets:
    needs: selection
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      SELECTION_RESULT: ${{ needs.selection.result }}
      CHECK_PLAN: ${{ needs.selection.outputs.plan }}
      CHECK_ENABLED: ${{ needs.selection.outputs.performance }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate selection and explain intentional skips
        run: node scripts/ci/run-checks.mjs gate budgets
      - name: Install virtual display dependencies
        if: needs.selection.outputs.performance == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: needs.selection.outputs.performance == 'true'
      - name: Install dependencies
        if: needs.selection.outputs.performance == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build production desktop
        if: needs.selection.outputs.performance == 'true'
        run: pnpm run build
      - name: Configure pinned Electron sandbox helper
        if: needs.selection.outputs.performance == 'true'
        run: |
          pnpm --filter git-stacks exec install-electron
          sandbox="$(realpath apps/desktop/node_modules/electron/dist/chrome-sandbox)"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Measure real desktop startup and interaction with bounded fixtures
        if: needs.selection.outputs.performance == 'true'
        # Xvfb provides an actual Chromium paint surface on the Linux runner.
        # Fixtures use the runner's own git; no clone, token, or private repository.
        run: xvfb-run -a pnpm run bench:performance
      - name: Upload trend data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-trend
          path: apps/desktop/benchmarks/
          if-no-files-found: warn

  beta-release:
    # A reusable call is explicit: releases created by GITHUB_TOKEN do not
    # trigger release.published workflows. PRs never enter this secret-bearing job.
    needs: [selection, automated, design, budgets, root-suite]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      source-sha: ${{ github.sha }}
      channel: beta
      automatic: true
    secrets: inherit
