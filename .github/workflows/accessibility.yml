name: Accessibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter git-stacks exec playwright install --with-deps chromium
      - name: Unit checks for the shared keyboard and state-label contracts
        run: pnpm --filter git-stacks exec tsx --test tests/tree-navigation.test.ts tests/components.test.ts
      - name: Typecheck
        run: pnpm run typecheck
      - name: axe audits, contrast, keyboard routes, and 200% zoom
        # The a11y suite runs against the real renderer fixtures served by Vite.
        # Pixel baselines are darwin-only and stay a local gate (pnpm run test:visual).
        run: xvfb-run -a pnpm run test:ui
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: apps/desktop/playwright-report/
          if-no-files-found: warn
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter design exec playwright install --with-deps chromium
      - run: pnpm --filter design check:manifest
      - run: pnpm --filter @git-stacks/ui tokens:check
      - run: pnpm --filter design build
      - run: pnpm --filter design test:catalog
      - name: Upload catalog failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-catalog-failures
          path: apps/design/test-results/
