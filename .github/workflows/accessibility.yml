name: Accessibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit checks for the shared keyboard and state-label contracts
        run: npx tsx --test tests/tree-navigation.test.ts tests/components.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: axe audits, contrast, keyboard routes, and 200% zoom
        # The a11y suite runs against the real renderer fixtures served by Vite.
        # Pixel baselines are darwin-only and stay a local gate (npm run test:visual).
        run: xvfb-run -a npx playwright test --grep-invert @visual
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: playwright-report/
          if-no-files-found: warn
