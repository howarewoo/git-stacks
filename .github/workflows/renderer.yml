name: Renderer and Accessibility Checks

# Visual, keyboard, accessibility (axe), and safety regression test harness for issue #9.
#
# Environment contract:
# - Baseline screenshot goldens are generated on macOS 26.5.2 (build 25F84, arm64) using Chromium.
# - CI executes on GitHub-hosted `macos-26` (Apple Silicon arm64) with identical pinned Chromium.
# - OS patch-level font drift still fails the strict pixel comparison; review differences,
#   never hide them with loose thresholds.
# - Automated axe/contrast checks do not replace a manual human screen-reader pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer:
    name: Renderer Checks (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run existing checks
        run: |
          npm test
          npm run build
          npm run tokens:check
          npm run format:check

      - name: Run renderer checks (visual, keyboard, axe, contrast, safety, states)
        run: npx playwright test

      - name: Upload Playwright test results and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-renderer-report
          path: |
            test-results/
            playwright-report/
          retention-days: 14
