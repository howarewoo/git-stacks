name: Signed desktop release

# One trigger, and it is the only publication path: a GitHub release being
# published. There is no workflow_dispatch, no schedule, no canary and no
# publish-from-branch trigger, so nothing in this file can mint a release or a
# signed manifest that a person did not publish a release for.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Check release identity and signing prerequisites
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}
          UPDATE_SIGNING_ADDITIONAL_KEY_ID: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_KEY_ID }}
          UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY }}
          UPDATE_SIGNING_ADDITIONAL_VALID_FROM: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_FROM }}
          UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./apps/desktop/package.json").version')"
          if [[ '${{ matrix.platform }}' != linux ]]; then
            test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
          fi
          if [[ '${{ matrix.platform }}' == darwin ]]; then
            test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          fi
          # The update feed is signed with a key this repository holds, not with
          # one this run makes up. Both halves are named here so a repository
          # that has not been given them says so before anything is built.
          test -n "$UPDATE_SIGNING_KEY" || { echo '::error::the UPDATE_SIGNING_KEY repository secret is missing; this release can package the app but cannot sign an update manifest'; exit 1; }
          test -n "$UPDATE_SIGNING_PUBLIC_KEY" || { echo '::error::the UPDATE_SIGNING_PUBLIC_KEY repository secret is missing; this build would ship with no release update key and could never verify a manifest'; exit 1; }
          # A rotation is declared with all four values or with none. Half of one
          # is a build that carries a key nobody can name, or a key nobody
          # retires, and it is indistinguishable from no rotation at all — so the
          # release that meant to introduce a key would quietly ship without it.
          declared=0
          for name in UPDATE_SIGNING_ADDITIONAL_KEY_ID UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY UPDATE_SIGNING_ADDITIONAL_VALID_FROM UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL; do
            if [ -n "${!name}" ]; then declared=$((declared + 1)); fi
          done
          if [ "$declared" -ne 0 ] && [ "$declared" -ne 4 ]; then
            echo "::error::$declared of the four UPDATE_SIGNING_ADDITIONAL_* values are set; a rotation is all four or none"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Put the MSVC toolchain on PATH
        # The clone promotion helper is compiled from source at build time, and a
        # Windows runner does not put MSVC on PATH by itself. Without this the
        # release build stops where it has no way to promote a clone.
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio C++ toolchain on this runner' }
          $environment = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          $toolchain = $false
          foreach ($line in $environment) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            if ($matches[1] -eq 'Path') {
              if ($matches[2] -match 'VC\\Tools\\MSVC') { $toolchain = $true }
              $matches[2] -split ';' | Where-Object { $_ } >> $env:GITHUB_PATH
            } else {
              "$line" >> $env:GITHUB_ENV
            }
          }
          if (-not $toolchain) { throw 'The MSVC toolchain did not reach PATH' }
      - name: Prove the checkout on its own, before a release key is in it
        # The suite is run against the repository as committed, with the key set
        # empty, so a release can never make a test pass or fail by the key it
        # happens to inject. Everything after this is about the key.
        run: pnpm test
      - name: Inject the release update key into this build
        working-directory: apps/desktop
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}
          UPDATE_SIGNING_KEY_ID: ${{ secrets.UPDATE_SIGNING_KEY_ID }}
          UPDATE_SIGNING_KEY_VALID_FROM: ${{ secrets.UPDATE_SIGNING_KEY_VALID_FROM }}
          UPDATE_SIGNING_KEY_VALID_UNTIL: ${{ secrets.UPDATE_SIGNING_KEY_VALID_UNTIL }}
          UPDATE_SIGNING_ADDITIONAL_KEY_ID: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_KEY_ID }}
          UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY }}
          UPDATE_SIGNING_ADDITIONAL_VALID_FROM: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_FROM }}
          UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL }}
        # Before `pnpm run dist`, because after it the key is inside the build.
        # The committed key set stays empty: a build that is not made by a
        # release trusts nothing and fetches nothing, which is the honest state
        # of a repository with no release key. This step proves the two secrets
        # are one keypair — it signs a fixed challenge with the private half and
        # verifies it with the public half — and fails closed if either secret is
        # missing, if they disagree, or if the key is not Ed25519. The private
        # half is never written, printed, or uploaded.
        run: pnpm exec tsx scripts/release-trusted-keys.ts inject
      - name: Refuse a build that would ship with no release key
        working-directory: apps/desktop
        shell: bash
        env:
          UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}
          UPDATE_SIGNING_KEY_ID: ${{ secrets.UPDATE_SIGNING_KEY_ID }}
          UPDATE_SIGNING_ADDITIONAL_KEY_ID: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_KEY_ID }}
          UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY }}
          UPDATE_SIGNING_ADDITIONAL_VALID_FROM: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_FROM }}
          UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL }}
        # The key is inside the build from here on, so an empty or wrong key set
        # is a build that can never verify any manifest. This reads the injected
        # set back and fails rather than shipping that build.
        run: pnpm exec tsx scripts/release-trusted-keys.ts check-injected
      - name: Hand the injected key set to the publishing job
        shell: bash
        run: |
          cp apps/desktop/resources/update-trusted-keys.json "injected-key-set-${{ matrix.platform }}-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-key-set-${{ matrix.platform }}-${{ matrix.arch }}
          path: injected-key-set-${{ matrix.platform }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7
      - run: pnpm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS app signature
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/"Git Stacks.app")
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign -dv --verbose=4 "${apps[0]}" 2>&1 | grep -Fq 'Authority=Developer ID Application:'
          xcrun stapler validate "${apps[0]}"
          test "$(codesign -dv --verbose=2 "${apps[0]}" 2>&1 | sed -n 's/^TeamIdentifier=//p')" = "$APPLE_TEAM_ID"
      - name: Verify Windows installer signature
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem apps/desktop/release -Filter *.exe)
          if ($artifacts.Count -eq 0) { throw 'No signed installer found' }
          foreach ($artifact in $artifacts) {
            if ((Get-AuthenticodeSignature $artifact.FullName).Status -ne 'Valid') {
              throw "Invalid Authenticode signature: $($artifact.Name)"
            }
          }
      - name: Sign, notarise, and staple the disk image
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The application inside the image is signed by the packager, and the
        # image is signed again over it. The updater refuses a disk image whose
        # own signature is missing or is not this app's, before it mounts
        # anything, so an image that is only signed inside is a release that
        # cannot be installed. The image is stapled and assessed as an image
        # here, which is the same pair of questions the app asks when it opens
        # one.
        #
        # The packager imports the certificate into a temporary keychain and
        # deletes that keychain when the build command returns, so by the time
        # this step runs there is no private key left anywhere. This step
        # therefore does the one thing that needs one, and does it in a keychain
        # that exists only here: created with a password generated for this
        # step, unlocked for this step, given a partition list that lets
        # codesign use it, made the only keychain in the search path so the
        # signing identity cannot come from somewhere else, and deleted again by
        # a trap however this step ends. The certificate is written to a file
        # this step owns and removed with it, and the keychain password and the
        # certificate are added to the log mask before either is used.
        #
        # The identity is the one distribution certificate in that keychain whose
        # team is the team this release claims. A development certificate for the
        # same team is not one: it cannot notarise and is not what the updater's
        # own check expects to find on an image. Zero or more than one is a
        # refusal rather than a guess, and a team selector alone is not used: a
        # selector is a search term, and a search that finds the wrong
        # certificate would sign a release as somebody else.
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(apps/desktop/release/*.dmg)
          test "${#images[@]}" -eq 1
          apps=(apps/desktop/release/mac*/"Git Stacks.app")
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          test "$(codesign -dv --verbose=2 "${apps[0]}" 2>&1 | sed -n 's/^TeamIdentifier=//p')" = "$APPLE_TEAM_ID"

          echo "::add-mask::$CSC_KEY_PASSWORD"
          echo "::add-mask::$APPLE_APP_SPECIFIC_PASSWORD"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          signing_keychain="$RUNNER_TEMP/git-stacks-signing.keychain-db"
          certificate="$RUNNER_TEMP/git-stacks-certificate.p12"
          previous_keychains_output="$(security list-keychains -d user)"
          previous_keychains=()
          while IFS= read -r keychain; do
            test -n "$keychain" || continue
            keychain="${keychain#*\"}"
            keychain="${keychain%\"*}"
            previous_keychains+=("$keychain")
          done <<< "$previous_keychains_output"
          cleanup() {
            security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true
            if [ -n "$previous_keychains_output" ]; then
              security list-keychains -d user -s "${previous_keychains[@]}"
            else
              security list-keychains -d user -s
            fi
            rm -f "$certificate"
          }
          trap cleanup EXIT

          rm -f "$signing_keychain" "$certificate"
          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          if [ -f "$CSC_LINK" ]; then
            cp "$CSC_LINK" "$certificate"
          else
            printf '%s' "$CSC_LINK" | base64 --decode > "$certificate"
          fi
          chmod 600 "$certificate"
          echo "::add-mask::$(base64 < "$certificate" | tr -d '\n')"
          security import "$certificate" -k "$signing_keychain" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          # A keychain created here is not trusted for signing until its
          # partition list says so, and the signing identity has to come from
          # this keychain rather than from whatever else this runner holds.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" \
            "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain"

          # `security find-identity -v` prints one line per identity as
          #   1) 0123456789ABCDEF...  "Developer ID Application: Name (TEAM)"
          # and `codesign --sign` is given the fingerprint and nothing else, so
          # what is taken off the line is the forty hex digits and then checked
          # against exactly that. Anything that is not forty hex digits is not an
          # identity, whatever the rest of the line says, and passing the whole
          # line to codesign would be a release signed by a name.
          matched=0
          identity=""
          while IFS= read -r line; do
            case "$line" in
              *"Developer ID Application:"*"($APPLE_TEAM_ID)"*) ;;
              *) continue ;;
            esac
            candidate="${line#*\) }"
            candidate="${candidate%% *}"
            if ! printf '%s' "$candidate" | grep -Eq '^[0-9A-F]{40}$'; then
              echo "the codesigning identity for team ${APPLE_TEAM_ID} is not a SHA-1 fingerprint: ${candidate}" >&2
              exit 1
            fi
            matched=$((matched + 1))
            identity="$candidate"
          done <<IDENTITIES
          $(security find-identity -v -p codesigning "$signing_keychain")
          IDENTITIES
          if [ "$matched" -ne 1 ]; then
            echo "expected exactly one codesigning identity for team ${APPLE_TEAM_ID}, found ${matched}" >&2
            exit 1
          fi
          echo "signing the image as the ${APPLE_TEAM_ID} identity ${identity}"

          codesign --force --sign "$identity" --timestamp --options runtime "${images[0]}"
          codesign --verify --strict --verbose=2 "${images[0]}"
          codesign -dv --verbose=4 "${images[0]}" 2>&1 | grep -Fq 'Authority=Developer ID Application:'
          test "$(codesign -dv --verbose=2 "${images[0]}" 2>&1 | sed -n 's/^TeamIdentifier=//p')" = "$APPLE_TEAM_ID"

          # notarytool knows nothing about electron-builder's environment. It
          # reads APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD only when they are
          # named on its own command line, or out of a stored keychain profile,
          # so a submit with neither is a submit that fails as uncredentialed
          # and not as a refusal.
          xcrun notarytool store-credentials git-stacks-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun notarytool submit "${images[0]}" --wait --keychain-profile git-stacks-notary
          xcrun stapler staple "${images[0]}"
          xcrun stapler validate "${images[0]}"
          spctl --assess --type open --context context:primary-signature -v "${images[0]}"
      - name: Produce the dependency inventory for this packaged app
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          artifact-name: sbom-release-${{ matrix.platform }}-${{ matrix.arch }}
          output-file: sbom-release-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json
          format: cyclonedx-json
      - name: Select distributable artifacts
        shell: bash
        run: |
          mkdir signed-release
          shopt -s nullglob
          artifacts=(apps/desktop/release/*.dmg apps/desktop/release/*.exe apps/desktop/release/*.AppImage)
          test "${#artifacts[@]}" -gt 0
          cp "${artifacts[@]}" signed-release/
      - name: Record what this runner packaged
        shell: bash
        # The publishing job needs to know which platform and architecture each
        # file is for; it does not guess it from a file name, and it will not
        # publish a manifest that is missing a build from this matrix.
        run: |
          pnpm --filter git-stacks exec tsx scripts/release-update-manifest.ts describe \
            --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' \
            --dir ../../signed-release --out "../../descriptors/${{ matrix.platform }}-${{ matrix.arch }}.json"
      - name: State the Linux support policy this release ships
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          # Checked-in policy line, printed on every Linux release:
          #   linux: best-effort artifact — built, published and signed, never updated in place by the app
          # The AppImage is published for someone to download and run from
          # wherever they put it. It is not updated in place because the app has
          # no way to: `installSupportFor()` in src/main/update/install.ts lists
          # only darwin and win32, so a packaged Linux build reports
          # `supported: false` and sits in the `unsupported` phase, and an
          # install offer on Linux is a refusal before the verified bytes are
          # looked at rather than a half-finished replacement.
          #
          # That is asserted by running the shipped code, not by reading it: the
          # test asks the installer what it supports on Linux, installs a staged
          # update anyway, and requires a refusal that writes nothing, starts
          # nothing and restarts nothing. A Linux installer appearing in the
          # source would fail this step because the app would answer differently
          # — and that is the moment the policy line above has to be rewritten,
          # rather than something that has to be remembered.
          #
          # Only that policy file runs here, and it is invoked by name. The rest
          # of the update tests are about the release key, and by this point in
          # the job the key set has been injected, so a suite-wide run would be
          # testing the checkout this release is building rather than the policy
          # it is stating.
          #
          # The step is required to be handed a proof, not to print a word that
          # looks like one. Selecting a test by name out of a file and reading a
          # test report for the count was the earlier way to do this, and it is
          # fragile in a way that fails open: on Node 22, a name pattern that
          # matched nothing exited 0 and reported one passing test, because the
          # file that matched nothing was itself a passing test. The
          # report is also worded differently between versions, and the report
          # line for the file and the line for the test inside it differ only by
          # a name. So the test records what it proved into the file this job
          # names, and the job requires that file: a renamed test, a deleted
          # test, or a runner that skipped it all leave no proof, and the step
          # fails rather than passing on silence.
          GIT_STACKS_POLICY_PROOF="$RUNNER_TEMP/linux-policy.proved" \
            pnpm --filter git-stacks exec tsx --test tests/update-linux-policy.test.ts
          test -s "$RUNNER_TEMP/linux-policy.proved" || {
            echo "::error::the Linux policy check left no proof, so this step proved nothing"
            exit 1
          }
          cat "$RUNNER_TEMP/linux-policy.proved"
          echo 'release policy — linux: best-effort artifact — built, published and signed, never updated in place by the app'
          shopt -s nullglob
          appimages=(signed-release/*.AppImage)
          test "${#appimages[@]}" -gt 0
      - name: Attest the packaged release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: signed-release/*
      - name: Hand the verified artifacts and their descriptors to the publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            signed-release/*
            descriptors/*.json
          if-no-files-found: error
          retention-days: 7

  release-assets:
    # Puts the verified installers on the release, and only after the
    # dependency checks have passed. A known-vulnerable tree stops here: the
    # artifacts stay in the run and nothing is published.
    needs: [package, supply-chain]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Collect the verified artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: signed-release-*
          path: .
          merge-multiple: true
      - name: Prove every artifact is the one this repository's runner attested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s nullglob
          artifacts=(signed-release/*)
          test "${#artifacts[@]}" -gt 0
          for artifact in "${artifacts[@]}"; do
            gh attestation verify "$artifact" --repo "$REPOSITORY"
          done
      - name: Upload only verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" signed-release/*

  publish:
    # Mints, signs and publishes one signed update manifest per channel. It runs
    # after every platform has packaged and attested, after the dependency checks
    # have passed, and after the installers are on the release, and it publishes
    # nothing at all unless the manifest verifies against the key the packaged
    # builds carry and every installer it names re-hashes to the digest it
    # published.
    needs: [supply-chain, release-assets]
    runs-on: ubuntu-24.04
    # One channel's history is read, this release's manifest is signed with the
    # next sequence, and the feed is moved — as one step, never two at a time.
    # Two releases published in the same moment would each read the same
    # published history, each issue the same next sequence for different bytes,
    # and the feed would then carry two releases claiming one sequence. Every
    # app that had already taken the first would refuse the second for good,
    # because a sequence is spent once used, and the release would be
    # un-installable until some later release moved the sequence on. The group
    # is per channel, so stable and beta publish independently, and a run that is
    # already in progress is never cancelled part-way through: half a
    # publication is the outcome this lock exists to prevent. A queued run waits
    # and then reads the history the run before it left behind, and re-checks
    # the version against the feed on its own terms, so waiting costs nothing
    # and skipping the check would cost correctness.
    concurrency:
      group: signed-desktop-publish-${{ github.event.release.prerelease && 'beta' || 'stable' }}
      cancel-in-progress: false
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the update signing key before anything is published
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}
          UPDATE_SIGNING_ADDITIONAL_KEY_ID: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_KEY_ID }}
          UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY }}
          UPDATE_SIGNING_ADDITIONAL_VALID_FROM: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_FROM }}
          UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo '::error::the UPDATE_SIGNING_KEY repository secret is missing, so this release cannot sign an update manifest. The installers are already published; the update feed is not moved.'
            exit 1
          fi
          if [ -z "$UPDATE_SIGNING_PUBLIC_KEY" ]; then
            echo '::error::the UPDATE_SIGNING_PUBLIC_KEY repository secret is missing, so this release cannot prove which key a manifest was signed with.'
            exit 1
          fi
          # A rotation is all four values or none, for the same reason the
          # packaging job refuses half of one: this job's key set is compared
          # against every packaged build's, and a key that reaches one and not
          # the others is a rotation that half happened.
          declared=0
          for name in UPDATE_SIGNING_ADDITIONAL_KEY_ID UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY UPDATE_SIGNING_ADDITIONAL_VALID_FROM UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL; do
            if [ -n "${!name}" ]; then declared=$((declared + 1)); fi
          done
          if [ "$declared" -ne 0 ] && [ "$declared" -ne 4 ]; then
            echo "::error::$declared of the four UPDATE_SIGNING_ADDITIONAL_* values are set; a rotation is all four or none"
            exit 1
          fi
      - name: Collect the verified artifacts and their descriptors
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: signed-release-*
          path: .
          merge-multiple: true
      - name: Collect the packaged key sets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: update-key-set-*
          path: injected-key-sets
          merge-multiple: true
      - name: Inject the release update key again, and prove it is the key the builds carry
        working-directory: apps/desktop
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}
          UPDATE_SIGNING_KEY_ID: ${{ secrets.UPDATE_SIGNING_KEY_ID }}
          UPDATE_SIGNING_KEY_VALID_FROM: ${{ secrets.UPDATE_SIGNING_KEY_VALID_FROM }}
          UPDATE_SIGNING_KEY_VALID_UNTIL: ${{ secrets.UPDATE_SIGNING_KEY_VALID_UNTIL }}
          UPDATE_SIGNING_ADDITIONAL_KEY_ID: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_KEY_ID }}
          UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_PUBLIC_KEY }}
          UPDATE_SIGNING_ADDITIONAL_VALID_FROM: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_FROM }}
          UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_VALID_UNTIL }}
        run: |
          pnpm exec tsx scripts/release-trusted-keys.ts inject
          shopt -s nullglob
          shipped=(../../injected-key-sets/*.json)
          test "${#shipped[@]}" -gt 0
          for keyset in "${shipped[@]}"; do
            if ! cmp -s "$keyset" resources/update-trusted-keys.json; then
              echo "::error::$keyset differs from the key set this job is signing with, so the packaged builds and the manifest disagree about which key to trust"
              exit 1
            fi
          done
          echo "the key set matches all ${#shipped[@]} packaged builds"
      - name: Mint, sign and verify this channel's update manifest
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}
          # Set this repository variable to the version a rollback replaces. A
          # release of an older version without it is refused, so a downgrade is
          # always an explicit, signed decision rather than a quiet one.
          ROLLBACK_OF: ${{ vars.UPDATE_ROLLBACK_OF }}
        # A published release carries one update channel: a prerelease goes to
        # the beta channel, a full release to stable. The manifest names the
        # installers this release produced, on the pinned release location, with
        # their size and SHA-256, and carries a sequence one higher than any this
        # channel has published — read back through the GitHub API, so a
        # sequence is never reused and a manifest is never a replay of one an
        # installation has already considered.
        #
        # A rollback is not a special case here: it is a release of an older
        # version, published with --rollback-of naming the version it replaces
        # and a sequence that is still higher than the one it replaces. The app
        # refuses a silent downgrade (a version that is not newer than the
        # running build, refused as `not-newer`) and refuses a manifest older
        # than the newest one it has seen (refused as `replayed`), so a rollback
        # has to be a new, higher-sequence, signed release that says what it is
        # rolling back. The script refuses a lower version that does not name
        # the version it replaces, so that can never be done by accident.
        #
        # Nothing is uploaded until the verifier has re-read the manifest and its
        # signature from disk, re-verified the signature with the key this
        # release injected, and re-hashed every installer.
        run: |
          if [ "$PRERELEASE" = "true" ]; then CHANNEL=beta; else CHANNEL=stable; fi
          VERSION="${RELEASE_TAG#v}"
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          ROLLBACK=()
          if [ -n "$ROLLBACK_OF" ]; then ROLLBACK=(--rollback-of "$ROLLBACK_OF"); fi
          pnpm exec tsx scripts/release-update-manifest.ts build \
            --channel "$CHANNEL" --version "$VERSION" \
            --descriptors ../../descriptors --artifact-dir ../../signed-release \
            --out-dir ../../channel-feed --stage-dir ../../channel-assets \
            --repo "$REPOSITORY" --notes "${RELEASE_NOTES:-Git Stacks $VERSION ($CHANNEL).}" \
            ${ROLLBACK[@]+"${ROLLBACK[@]}"}
          pnpm exec tsx scripts/release-update-sign.ts --channel "$CHANNEL" --manifest "../../channel-feed/update-$CHANNEL.json"
          pnpm exec tsx scripts/release-update-verify.ts --channel "$CHANNEL" --manifest "../../channel-feed/update-$CHANNEL.json" --artifact-dir ../../channel-assets
      - name: Verify the provenance of every artifact about to be published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s nullglob
          staged=(channel-assets/*)
          test "${#staged[@]}" -gt 0
          for artifact in "${staged[@]}"; do
            gh attestation verify "$artifact" --repo "$REPOSITORY"
          done
      - name: Publish the signed channel feed
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then CHANNEL=beta; else CHANNEL=stable; fi
          # A moving release tag per channel, so the feed URL the app resolves
          # (https://github.com/howarewoo/git-stacks/releases/download/<tag>/)
          # never has to change. It is only ever moved forward along this
          # repository's history: a tag that has been moved elsewhere stops the
          # release rather than being overwritten.
          TAG="updates-$CHANNEL"
          COMMIT="$(gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          CURRENT="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$COMMIT" ]; then
            AHEAD="$(gh api "repos/$REPOSITORY/compare/$CURRENT...$COMMIT" --jq .status)"
            if [ "$AHEAD" != ahead ] && [ "$AHEAD" != identical ]; then
              echo "::error::the $TAG release tag is not an ancestor of $RELEASE_TAG; refusing to move it"
              exit 1
            fi
            gh api -X PATCH "repos/$REPOSITORY/git/refs/tags/$TAG" -F force=true -f sha="$COMMIT" >/dev/null
          elif [ -z "$CURRENT" ]; then
            gh api -X POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" >/dev/null
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$COMMIT" \
              --title "Git Stacks $CHANNEL update feed" \
              --notes "Moving release for the $CHANNEL update channel. The current manifest is update-$CHANNEL.json, signed with the project release key; its installers are the assets beside it."
          fi
          # The channel feed is published by a script, in an order that a run
          # interrupted part way through cannot leave the channel without: the
          # manifest and its signature are banked under names of their own
          # first, then the installers, then the two fixed names a client
          # fetches, and finally both fixed names are read back off the release
          # and proved. Nothing is deleted, and nothing a client needs is only
          # reachable after it exists somewhere that is never rewritten.
          pnpm exec tsx scripts/release-update-publish.ts --channel "$CHANNEL" --repo "$REPOSITORY" \
            --feed ../../channel-feed --installers ../../channel-assets

  supply-chain:
    # The dependency inventory for the packaged app, and a stop on a known
    # vulnerable dependency. Separate from packaging so a vulnerability is
    # reported once, against the whole tree, rather than four times per runner.
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse a known-vulnerable dependency
        shell: bash
        # High or critical, in any dependency the build and the app ship. A
        # release stops here rather than shipping a known-vulnerable tree.
        run: pnpm audit --audit-level=high
      - name: Scan the dependency tree for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # pnpm 12 keeps the app graph in the second lockfile YAML document.
          version: 'v0.75.0'
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules
          exit-code: '1'
      - name: Publish the dependency inventory
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          artifact-name: sbom-release-dependency-tree
          output-file: sbom-release-dependency-tree.cdx.json
          format: cyclonedx-json
      - name: Keep the inventory with the release run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-release-dependency-tree
          path: sbom-release-dependency-tree.cdx.json
          if-no-files-found: error
          retention-days: 30
