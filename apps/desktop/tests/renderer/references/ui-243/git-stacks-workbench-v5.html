function showNotes(){
 modalContext={kind:'notes'};
 showModal('Review and ship. Keep your development tool.','A worktree-aware Git / GitHub workbench, not another development environment.',`<div class="status-note">${icon('worktree')}<div><strong>The boundary for this revision</strong><p>Develop in Orca or your preferred editor. Use Git Stacks to inspect, organize, review, synchronize, and land the branches and PRs that work produces.</p></div></div><div class="note-grid"><section><h3>01 · One branch surface</h3><p>Branches and worktrees share one row-based surface. A worktree is optional context attached to its checked-out branch, not a second list of the same work. Pull requests keep their dedicated review list. The separate Stacks graph is removed.</p></section><section><h3>02 · Relationships stay in the list</h3><p>Bottom-up lanes show base branches below their descendants, with chains and forks growing upward beside aligned rows. Display order does not change the parent-first execution order of scoped Git operations. Lines represent the fixture’s declared branch-parent relationship, not a commit timeline, upstream tracking, or inferred GitHub stack membership. Selecting a row highlights ancestors and descendants; it never changes a checkout.</p></section><section><h3>03 · Adopt existing worktrees</h3><p>Discovery is the primary action. Directories created by any development tool can be inspected without recreating them or changing their checked-out branch. Creation remains secondary; branches without directories remain reviewable.</p></section><section><h3>04 · Attention across repositories</h3><p>New commits to review, changes requested, failing checks, conflicts, and required restacks share one queue. Each item opens the relevant diff, conversation, check log, or scoped preview.</p></section><section><h3>05 · Review here; edit elsewhere</h3><p>Local changes and conflicts are read-only. There is no code editor, terminal, staging, commit composer, or agent integration. PR conversations, file review notes, publishing, merge previews, and history remain available.</p></section><section><h3>06 · Honest local-operation safety</h3><p>External tool activity is unknown, not idle. A clean worktree does not prove exclusive access. Restack and cleanup require explicit external-work acknowledgement as well as scope confirmation. Production must still revalidate repository identity, path, HEAD, index, parent tips, and operation state; an acknowledgement is not a process lock.</p></section><section><h3>07 · Distinguish local and published heads</h3><p>Review drafts and check results bind to the published PR head. Unpushed commits remain separate. Publishing a changed head clears stale review/check assumptions. Merging preserves local directories; descendant restacks and cleanup are explicit follow-up operations.</p></section><section><h3>08 · Filter without losing ancestry</h3><p>Attention, unpublished, readiness, search, and worktree-availability filters retain required ancestors as labelled context rows. Context rows and trunk cannot enter bulk selection. Pagination and branch folding disclose omitted rows. Lanes reuse tracks for single-child chains and preserve forks. Unknown parents get no invented edge. No stack names or separate graph canvas.</p></section></div><section class="detail-section"><h3>Same Quiet Workbench design system</h3><p class="meta" style="margin-top:8px">Cool-gray canvas, neutral ink primary actions, labelled semantic colors, local/system fonts, 12 / 16 / 24 px radii, and the repository’s light and dark token palettes. Lane rows keep branch identity, optional directory, local changes, and PR status together. At narrower pane widths, worktree context moves under the branch; all values remain available in the inspector.</p><div class="token-swatches"><span class="token-swatch"><span style="background:var(--canvas)"></span>Canvas</span><span class="token-swatch"><span style="background:var(--surface)"></span>Surface</span><span class="token-swatch"><span style="background:var(--ink)"></span>Ink</span><span class="token-swatch"><span style="background:var(--selection)"></span>Selection</span><span class="token-swatch"><span style="background:var(--amber-bg)"></span>Attention</span></div></section><section class="detail-section"><h3>Prototype scope</h3><p class="meta" style="margin-top:8px;line-height:1.8">This revision edits the existing HTML prototype and preserves its design-system baseline from <code>howarewoo/git-stacks @ 9ec11e9</code>: <code>DESIGN.md</code>, <code>packages/ui/src/tokens/tokens.json</code>, and shared UI treatments. It is dependency-free native HTML, not an Electron implementation or a new repository inspection. Production should compose <code>@git-stacks/ui</code> controls behind the typed desktop API. Every PR, path, diff, check, and discovered directory is illustrative. No filesystem scan, Git command, GitHub request, or Orca integration is performed. Demo data and drafts stay in this browser.</p></section>`,`<button class="btn secondary" data-action="shortcuts">${icon('keyboard')} Shortcuts</button><button class="btn primary" data-action="close-modal">Back to workbench</button>`,true);
}

function discoveryCandidates(repo){
 const specs=[['import-'+repo.id+'-1',repo.id,'feat/quick-repository-switch','Restore context when switching repositories',repo.id==='gs'?259:repo.id==='ak'?91:420,'review',0,'main',0],['import-'+repo.id+'-2',repo.id,'fix/review-draft-cache','Keep review drafts bound to their PR',null,'unpublished',0,'main',2]];

 const repo=repoBy(repoId||(ui.repo==='all'?'gs':ui.repo)),candidates=discoveryCandidates(repo);
 modalContext={kind:'discovery',repo:repo.id,candidates};
 showModal('Discover existing worktrees','Inspect directories you already created. Nothing is checked out, recreated, or launched.',`<div class="form-group"><label class="form-label" for="discover-repository">Repository</label><select class="field" id="discover-repository">${repos.map(r=>`<option value="${r.id}" ${r.id===repo.id?'selected':''}>${r.owner} / ${r.name}</option>`).join('')}</select></div><div class="status-note" style="margin-top:16px">${icon('eye')}<div><strong>Read-only discovery · sample results</strong><p>${items.filter(w=>w.repo===repo.id&&w.worktree).length} directories already in the workbench. ${candidates.length} additional existing ${candidates.length===1?'directory':'directories'} shown below. This HTML does not scan your filesystem.</p></div></div><section class="detail-section"><div class="section-label"><h3>${candidates.length?'Not yet in your workbench':'Everything is already tracked'}</h3></div>${candidates.map(w=>`<label class="discovery-row"><input class="check" type="checkbox" data-discovered="${w.id}" checked><span><strong class="mono">${esc(w.branch)}</strong><small class="path">${esc(pathLabel(w))}</small><small>${w.pr?'PR #'+w.pr:'No PR'} · ${w.ahead?w.ahead+' unpublished commits':'No uncommitted files'}</small></span></label>`).join('')}${!candidates.length?'<p class="meta">Select another repository, or return to the existing worktree list.</p>':''}</section><p class="meta">No agent registration or development-tool integration is required.</p>`,`<button class="btn ghost" data-action="new-worktree">${icon('plus')} New worktree instead…</button><button class="btn primary" data-action="import-discovered" id="import-discovered" ${candidates.length?'':'disabled'}>Add ${candidates.length} to workbench · demo</button>`);
 $('#discover-repository').onchange=e=>discoverWorktrees(e.target.value);
 $$('[data-discovered]').forEach(c=>c.onchange=()=>{const count=$$('[data-discovered]:checked').length;$('#import-discovered').disabled=!count;$('#import-discovered').textContent=`Add ${count} to workbench · demo`});
}
function importDiscovered(){
 const ctx=modalContext;if(ctx?.kind!=='discovery')return;
 const ids=new Set($$('[data-discovered]:checked').map(c=>c.dataset.discovered));
 const additions=ctx.candidates.filter(w=>ids.has(w.id));if(!additions.length)return;
 if(additions.some(w=>items.some(x=>x.repo===w.repo&&(x.branch===w.branch||x.worktree===w.worktree)))){closeModal();toast('Directory records changed. Open discovery again.');return}
 items.push(...additions);for(const w of additions)addEvent('Existing worktree added to demo',w,'Directory and checkout were not recreated','worktree');
 closeModal();if(ui.repo!==ctx.repo)switchRepo(ctx.repo);ui.view='branches';ui.filter='all';ui.query='';ui.worktreeScope='all';ui.selected=additions[0].id;ui.showInspector=true;ui.collapsed.delete('inprogress');locateBranch(additions[0].id);toast(`Added ${additions.length} existing directory records. No checkout changed.`);
}
function openLocalDiff(w,index){
 if(!w?.worktree||!w.dirty)return;const path=workingFiles(w)[index];if(!path)return;
 modalContext={kind:'local-diff',id:w.id,head:w.head};
 showModal('Inspect local changes',`<code>${esc(w.branch)}</code> · uncommitted working-directory snapshot`,`${scopeBlock(w)}<div class="diff-frame"><div class="diff-file-head">${esc(path)}</div><div class="diff-content">${DIFFS[0].map(([kind,old,n,text])=>`<div class="diff-line ${kind}"><span class="num">${old}</span><span class="num">${n}</span><span>${kind==='add'?'+':kind==='remove'?'−':' '}</span><span>${esc(text)}</span></div>`).join('')}</div></div><p class="diff-note">Illustrative local patch, not a fetched diff. Editing, staging, and commits stay in your development tool. These changes are not part of the published PR.</p>`,`<button class="btn secondary" data-action="copy-path" data-id="${w.id}">${icon('copy')} Copy directory</button><button class="btn primary" data-action="close-modal">Done</button>`,true);
}


// Keep keyboard navigation inside either open dialog, including wraparound.
for(const dialog of [$('#modal'),$('#palette')]){
 dialog.addEventListener('keydown',event=>{
  if(event.key!=='Tab')return;
  const controls=[...dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length>0);
  if(!controls.length){event.preventDefault();return}
  const first=controls[0],last=controls.at(-1),current=document.activeElement;
  if(event.shiftKey&&(current===first||!dialog.contains(current))){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&(current===last||!dialog.contains(current))){event.preventDefault();first.focus()}
 });
}

$('#brand-mark').innerHTML=icon('layers');
const laneObserver=new ResizeObserver(scheduleLaneDraw);laneObserver.observe($('#main-panel'));
window.addEventListener('resize',scheduleLaneDraw);
render();
</script>
</body>
